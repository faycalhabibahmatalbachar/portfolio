name: Portfolio CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Static export and SEO smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Smoke test generated pages
        run: |
          test -s out/index.html
          test -s out/robots.txt
          test -s out/sitemap.xml
          grep -q 'Faycal Habib Ahmat' out/index.html
